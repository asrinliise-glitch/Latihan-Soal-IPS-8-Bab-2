const T=pts.reduce((a,b)=>a+b,0);$("tot").innerHTML=`Total poin terbaik: <b>${T}</b>`}
function start(i){zi=i;idx=0;ok=0;sc=0;st=0;log=[];t0=Date.now();items=build(i);show("play");ask()}
function timer(sec,onEnd){clearInterval(tm);tmax=tl=sec;dl=Date.now()+sec*1000;const b=$("tb");b.className="bar";const f=()=>{b.firstChild.style.width=(tl/tmax*100)+"%";b.classList.toggle("lo",tl/tmax<.25);$("tt").textContent="⏱ "+Math.ceil(tl)+" dtk"};f();
tm=setInterval(()=>{tl=Math.max(0,(dl-Date.now())/1000);f();if(tl<=0){clearInterval(tm);onEnd()}},200)}
function ask(){window.scrollTo(0,0);const it=items[idx];$("zn").textContent=`${Z[zi].i} ${Z[zi].n} · ${idx+1}/${items.length}`;$("sc").textContent=`Poin ${sc}`;$("pb").style.width=(idx/items.length*100)+"%";
$("fb").hidden=$("nx").hidden=true;const o=$("op");o.innerHTML="";
$("tp").textContent={K:"Konsep",H:"HOTS · Kasus",J:"Jodohkan"}[it.k];
if(it.k==="J"){$("qq").textContent="Jodohkan istilah dengan penjelasan yang tepat. Ketuk istilah, lalu penjelasannya.";match(it,o)}
else{$("qq").textContent=it.q;sh(it.o.map((t,i)=>[t,i])).forEach(([t,i])=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>pick(b,i===0);o.appendChild(b)});timer(CFG.T[it.k],()=>pick(null,false,true))}}
function pick(b,c,to){const it=items[idx];[...document.querySelectorAll("#op .o")].forEach(x=>{x.disabled=true;if(x.textContent===it.o[0])x.classList.add("ok")});if(b&&!c)b.classList.add("no");
fin(c,(it.k==="H"?15:10),it.e,to)}
function match(it,o){let sel=null,left=0,mis=0,tf=false;const L=it.p.map((p,i)=>[p[0],i]),R=sh(it.p.map((p,i)=>[p[1],i]));const g=document.createElement("div");g.className="mt";
const lc=document.createElement("div"),rc=document.createElement("div");[lc,rc].forEach(c=>c.style.cssText="display:grid;gap:8px");
const lb=L.map(([t,i])=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>{lb.forEach(x=>x.classList.remove("sel"));if(!b.disabled){sel=i;b.classList.add("sel")}};lc.appendChild(b);return b});
const rb=R.map(([t,i])=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>{if(sel===null)return;if(sel===i){lb[sel].disabled=b.disabled=true;lb[sel].classList.remove("sel");lb[sel].classList.add("ok");b.classList.add("ok");sel=null;if(++left===4)done()}else{mis++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),400)}};rc.appendChild(b);return b});
g.append(lc,rc);o.appendChild(g);
function done(){fin(mis<=1&&!tf,20,"Pasangan yang benar: "+it.p.map(p=>p[0]).join("; ")+(mis?` (salah memasangkan ${mis}×)`:"."),tf)}
timer(CFG.T.J,()=>{tf=true;lb.concat(rb).forEach(x=>x.disabled=true);done()})}
function fin(c,base,exp,to){clearInterval(tm);const bonus=c?Math.ceil(tl/tmax*5):0;
if(c){ok++;st++;sc+=base+bonus+Math.min(st-1,3)*2}else st=0;
log.push(items[idx].k+(idx+1)+":"+(c?1:0));$("sc").textContent=`Poin ${sc}`;const f=$("fb");f.hidden=false;
f.innerHTML=(c?`✅ <b>Tepat!</b> +${base+bonus}${st>1?` · beruntun ×${st}`:""} `:to?"⏰ <b>Waktu habis.</b> ":"❌ <b>Belum tepat.</b> ")+exp;
const n=$("nx");n.hidden=false;n.textContent=idx<items.length-1?"Soal berikutnya →":"Lihat hasil";n.scrollIntoView({block:"nearest",behavior:"smooth"});n.onclick=()=>{idx++;idx<items.length?ask():end()}}
function end(){clearInterval(tm);$("pb").style.width="100%";const pc=ok/items.length,s=pc>=.9?3:pc>=.75?2:pc>=.6?1:0;best[zi]=Math.max(best[zi],s);pts[zi]=Math.max(pts[zi],sc);
show("end");$("es").textContent=s?"⭐".repeat(s):"💪";$("et").textContent=["Ayo coba lagi!","Bagus, terus berlatih!","Hebat!","Sempurna!"][s];
$("ep").innerHTML=`${ok} dari ${items.length} benar · ${sc} poin`+(best.every(x=>x>0)?"<br><b>🏅 Semua zona selesai: kamu Penjaga Nusantara!</b>":"");
$("sn").textContent="Mengirim hasil…";
send({waktu:new Date().toISOString(),nama:me.nama,kelas:me.kelas,absen:me.absen,sekolah:me.sekolah,zona:Z[zi].n,benar:ok,dari:items.length,skor:sc,bintang:s,durasi_detik:Math.round((Date.now()-t0)/1000),detail:log.join(" ")}).then(m=>$("sn").textContent=m)}
async function send(r){let q=[];try{q=JSON.parse(localStorage.getItem("antrian")||"[]")}catch(e){}q.push(r);
if(!CFG.URL){try{localStorage.setItem("antrian",JSON.stringify(q))}catch(e){}return"Mode uji: alamat spreadsheet belum diisi, hasil belum dikirim."}
const rest=[];for(const x of q){try{await fetch(CFG.URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...x,kunci:CFG.KEY})})}catch(e){rest.push(x)}}
try{localStorage.setItem("antrian",JSON.stringify(rest))}catch(e){}
return rest.length?"⚠️ Koneksi bermasalah. Hasil disimpan di perangkat dan dikirim ulang saat kamu menyelesaikan zona berikutnya.":"✔ Hasil terkirim ke guru."}
$("go").onclick=()=>{const v=id=>$(id).value.trim();me={nama:v("nm"),kelas:v("kl"),absen:v("ab"),sekolah:v("sk")};
if(!me.nama||!me.kelas){$("er").textContent="Nama dan kelas wajib diisi.";return}$("er").textContent="";try{localStorage.setItem("siswa",JSON.stringify(me))}catch(e){}home()};
$("rb").onclick=home;$("ra").onclick=()=>start(zi);
$("tg").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
try{const s=JSON.parse(localStorage.getItem("siswa")||"{}");$("nm").value=s.nama||"";$("kl").value=s.kelas||"";$("ab").value=s.absen||"";$("sk").value=s.sekolah||""}catch(e){}
</script></body></html>
